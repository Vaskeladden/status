owner: Vaskeladden
repo: vaskeladden-status

sites:
  # IAP-protected services use direct Cloud Run URLs to bypass IAP for health checks
  - name: Admin
    url: https://admin-app-tixlcgtqna-lz.a.run.app/health
  - name: Dashboard
    url: https://dashboard-app-tixlcgtqna-lz.a.run.app/health
  # Public services use custom domains
  - name: Meme
    url: https://meme.vaskeladden.com/health
  - name: Web
    url: https://web.vaskeladden.com/health
  - name: Status
    url: https://status.vaskeladden.com

status-website:
  cname: status.vaskeladden.com
  name: Vaskeladden Status
  introTitle: "**Vaskeladden** service status"
  introMessage: "Real-time availability and response time monitoring for Vaskeladden services."
  theme: light
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Notifications (uncomment and configure after setting up Slack webhook)
# notifications:
#   - type: slack
#     channel: alerts

# Incident management
assignees:
  - Habitats

# History settings
commitMessages:
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "upptime@vaskeladden.no"

# CI settings
runner: ubuntu-latest
