owner: Vaskeladden
repo: vaskeladden-status

sites:
  # IAP-protected services: 302 redirect confirms service and IAP are responding
  - name: Admin
    url: https://admin.vaskeladden.com/health
    expectedStatusCodes:
      - 200
      - 302  # IAP redirect confirms service is up
  - name: Dashboard
    url: https://dashboard.vaskeladden.com/health
    expectedStatusCodes:
      - 200
      - 302  # IAP redirect confirms service is up
  # Public services
  - name: Meme
    url: https://meme.vaskeladden.com/health
  - name: Web
    url: https://web.vaskeladden.com/health
  - name: Status
    url: https://status.vaskeladden.com

status-website:
  cname: status.vaskeladden.com
  name: Vaskeladden Status
  introTitle: "**Vaskeladden** service status"
  introMessage: "Real-time availability and response time monitoring for Vaskeladden services."
  theme: light
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Notifications (uncomment and configure after setting up Slack webhook)
# notifications:
#   - type: slack
#     channel: alerts

# Incident management
assignees:
  - Habitats

# History settings
commitMessages:
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "upptime@vaskeladden.no"

# CI settings
runner: ubuntu-latest
